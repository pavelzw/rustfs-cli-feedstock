context:
  version: "0.1.35"

package:
  name: rustfs-cli
  version: ${{ version }}

source:
  url: https://github.com/rustfs/cli/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a4cdf29bf2621f0edc3f37ef02f1608e5f5cc5e389951e61e99353d8e4d4b55b

build:
  number: 0
  script:
    env:
      # Use cmake to build aws-lc-sys, because conda's CFLAGS inject -O2 which
      # overrides the -O0 required by jitterentropy-base.c, causing a build failure.
      AWS_LC_SYS_CMAKE_BUILDER: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path ./crates/cli
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path ./crates/cli
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - cmake
    - make

tests:
  - script: rc --help
  - package_contents:
      bin:
        - rc
      strict: true

about:
  homepage: https://github.com/rustfs/cli
  summary: An S3-compatible command-line client written in Rust
  description: |
    rc is a Rust S3 CLI client for S3-compatible object storage. It provides
    commands for managing buckets and objects against AWS S3, RustFS, MinIO,
    and other S3-compatible services, including an Admin API interface.
  license: MIT OR Apache-2.0
  license_file:
    - LICENSE-APACHE
    - LICENSE-MIT
    - THIRDPARTY.yml
  documentation: https://github.com/rustfs/cli
  repository: https://github.com/rustfs/cli

extra:
  recipe-maintainers:
    - pavelzw
